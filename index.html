<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PandaGizmo BD</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5fbff;
            color: #0b2545;
        }

        header {
            background: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            margin: 25px;
            padding: 35px;
            border-radius: 20px;
            background: linear-gradient(120deg, #0b2545, #168bd2);
            color: white;
        }

        .hero h1 {
            font-size: 38px;
        }

        button {
            background: #168bd2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        /* ===== PandaGizmo Product Cards ===== */

#products {
    padding: 20px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.product-card {
    background: #ffffff;
    border: 1px solid #dceaf4;
    border-radius: 14px;
    padding: 10px;
    overflow: hidden;
}

.product-image {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #f5fbff;
    border-radius: 10px;
}

.product-name {
    font-size: 15px;
    line-height: 1.5;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.product-price {
    color: #168bd2;
    font-size: 18px;
    font-weight: bold;
}

.product-old-price {
    color: #888888;
    font-size: 13px;
    text-decoration: line-through;
}

@media (min-width: 700px) {
    .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}
        
    </style>
</head>

<body>

    <header>
        <div class="logo">🐼 PandaGizmo BD</div>
        <button onclick="openWhatsApp()">WhatsApp</button>
    </header>

    <section class="hero">
        <h1>টেক লাইফ হোক আরও স্মার্ট!</h1>
        <p>
            আপনার পছন্দের গ্যাজেট ও মোবাইল অ্যাক্সেসরিজ
            খুঁজুন PandaGizmo BD-তে।
        </p>

        <button onclick="showProducts()">
            এখনই শপ করুন
        </button>
    </section>

    <section id="products">
    <h2>আমাদের পণ্য</h2>
    <p id="message">পণ্য লোড হচ্ছে...</p>
</section>

    <script>
        const API_BASE =
            "https://pandashop-bd-api-2026.pandagizmofficial.workers.dev";

        function openWhatsApp() {
            window.open(
                "https://wa.me/8801331199256",
                "_blank"
            );
        }

        function showProducts() {
            document.getElementById("products").scrollIntoView({
                behavior: "smooth"
            });
        }

        async function loadProducts() {
            try {
                const response = await fetch(
                    API_BASE + "/api/products"
                );

                if (!response.ok) {
                    throw new Error("পণ্য লোড করা যায়নি");
                }

                const data = await response.json();

                document.getElementById("message").textContent =
                    "API থেকে পণ্যের তথ্য পাওয়া গেছে।";

                console.log(data);

            } catch (error) {
                document.getElementById("message").textContent =
                    "পণ্য লোড করা যায়নি। পরে আবার চেষ্টা করুন।";

                console.error(error);
            }
        }

        loadProducts();
    </script>

</body>
</html>
