<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="description" content="PandaGizmo BD — গ্যাজেট ও মোবাইল অ্যাক্সেসরিজ অনলাইন শপ।">
<title>PandaGizmo BD | Online Gadget Store</title>
<style>
:root {
  --navy: #0b2545;
  --blue: #168bd2;
  --sky: #eaf7ff;
  --ink: #142b45;
  --muted: #66788a;
  --line: #dceaf4;
  --bg: #f5fbff;
  --green: #12845b;
}
* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: 100px;
}
body {
  margin: 0;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding-bottom: 78px;
}
button, input, textarea, select {
  font: inherit;
}
button { cursor: pointer; }
.wrap {
  width: min(1180px, 92%);
  margin: auto;
}
.topbar {
  background: var(--navy);
  color: white;
  padding: 9px 0;
  font-size: 13px;
}
.topbar .wrap {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
header {
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--line);
}
.nav {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: var(--navy);
  font-size: 20px;
  font-weight: 900;
  white-space: nowrap;
}
.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  background: var(--sky);
  border-radius: 13px;
  font-size: 27px;
}
.brand small {
  display: block;
  color: var(--blue);
  font-size: 9px;
  letter-spacing: 1px;
}
.searchbox {
  flex: 1;
  max-width: 450px;
  display: flex;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
}
.searchbox input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 0;
  outline: 0;
  background: transparent;
}
.searchbox button {
  border: 0;
  padding: 0 16px;
  background: var(--blue);
  color: white;
}
.btn {
  padding: 11px 15px;
  border: 0;
  border-radius: 10px;
  font-weight: 700;
}
.primary { background: var(--blue); color: white; }
.dark { background: var(--navy); color: white; }
.light { background: var(--sky); color: var(--navy); }
.hero { padding: 25px 0 10px; }
.hero-panel {
  padding: clamp(24px, 5vw, 55px);
  border-radius: 24px;
  color: white;
  background: linear-gradient(120deg, #0b2545, #075b99, #168bd2);
  display: grid;
  grid-template-columns: 1.3fr .7fr;
  align-items: center;
  gap: 20px;
}
.eyebrow {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 30px;
  background: #ffffff20;
}
.hero h1 {
  font-size: clamp(29px, 4vw, 49px);
  line-height: 1.2;
  margin: 16px 0;
}
.hero p {
  color: #e0f2ff;
  line-height: 1.8;
}
.hero-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.hero-circle {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff25;
  border: 1px solid #ffffff50;
  font-size: 100px;
}
.trust {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 18px 0 28px;
}
.trust-item {
  padding: 15px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.trust-item strong {
  display: block;
  margin-bottom: 6px;
}
.trust-item span {
  color: var(--muted);
  font-size: 13px;
}
.section { margin: 28px 0; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin: 20px 0 15px;
}
.section-head h2 {
  color: var(--navy);
  font-size: clamp(21px, 3vw, 28px);
  margin: 0 0 6px;
}
.section-head p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}
.categories {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 3px 0 14px;
}
.chip {
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 9px 14px;
  background: white;
  color: var(--navy);
  font-weight: bold;
}
.chip.active {
  background: var(--navy);
  color: white;
}
.products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px;
}
.card {
  position: relative;
  padding: 11px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  min-width: 0;
  transition: .2s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px #173c5c15;
}
.product-image {
  height: 170px;
  border-radius: 11px;
  background: linear-gradient(145deg, #eaf7ff, #f8fcff);
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
}
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.emoji-product { font-size: 62px; }
.tag {
  display: inline-block;
  color: #08764d;
  background: #d9f7e8;
  padding: 5px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}
.image-tag {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 1;
}
.wish {
  position: absolute;
  right: 8px;
  top: 8px;
  border: 0;
  background: #ffffffed;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 18px;
  color: #c33;
}
.card h3 {
  font-size: 14px;
  line-height: 1.45;
  min-height: 40px;
  margin: 10px 0 5px;
}
.product-meta {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 9px;
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  flex-wrap: wrap;
}
.price {
  font-size: 17px;
  font-weight: bold;
  color: var(--blue);
}
.old-price {
  color: #8998a8;
  text-decoration: line-through;
  font-size: 12px;
}
.card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 10px;
}
.card-actions button {
  padding: 9px 5px;
  border: 0;
  border-radius: 9px;
  font-size: 12px;
  font-weight: bold;
}
.add { background: var(--navy); color: white; }
.details-btn { background: var(--sky); color: var(--navy); }
.empty {
  grid-column: 1 / -1;
  background: white;
  padding: 25px;
  text-align: center;
  border-radius: 15px;
}
.promo {
  margin: 32px 0;
  padding: 23px;
  background: #dff3ff;
  border-radius: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.promo h2 { margin: 0 0 8px; }
.promo p { margin: 0; color: var(--muted); }
footer {
  background: var(--navy);
  color: white;
  margin-top: 40px;
  padding: 32px 0 18px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 22px;
}
.footer-grid p {
  line-height: 1.8;
  color: #d0e4f5;
  font-size: 14px;
}
.footer-grid a { color: white; }
.copyright {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #ffffff30;
  font-size: 12px;
}
.backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #06172bd9;
}
.backdrop.open { display: flex; }
.modal {
  width: min(700px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: white;
  border-radius: 18px;
  padding: 20px;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.modal-head h2 {
  font-size: 21px;
  margin: 5px 0 16px;
}
.close {
  border: 0;
  background: var(--sky);
  padding: 8px 11px;
  border-radius: 8px;
}
.cart-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.qty {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 9px;
  flex-wrap: wrap;
}
.qty button {
  padding: 5px 10px;
  border: 1px solid var(--line);
  background: var(--sky);
  border-radius: 6px;
}
.remove {
  color: #c0392b;
  background: none !important;
  border: 0 !important;
}
.total {
  display: flex;
  justify-content: space-between;
  margin: 18px 0;
  font-size: 19px;
  font-weight: bold;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field.full { grid-column: 1 / -1; }
.field label {
  font-size: 13px;
  font-weight: bold;
}
.field input,
.field textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px;
}
.field textarea { min-height: 72px; }
.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}
.whatsapp {
  width: 100%;
  background: var(--green);
  color: white;
  margin-top: 10px;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.detail-image {
  min-height: 250px;
  background: var(--sky);
  border-radius: 13px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.detail-image img {
  width: 100%;
  height: 100%;
  max-height: 350px;
  object-fit: contain;
}
.detail-image .emoji-product { font-size: 100px; }
.detail-copy h2 { margin: 8px 0; }
.detail-copy p { line-height: 1.7; }
.specs {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
}
.specs td {
  padding: 9px;
  border: 1px solid var(--line);
  font-size: 13px;
}
.specs td:first-child {
  font-weight: bold;
  background: #f6fbff;
}
.detail-qty {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
}
.detail-qty button {
  padding: 7px 12px;
  border: 1px solid var(--line);
  background: var(--sky);
  border-radius: 7px;
}
.detail-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 8px 5px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 20px #0b254510;
}
.bottom-nav button {
  flex: 1;
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 11px;
  display: grid;
  gap: 3px;
  justify-items: center;
}
.bottom-nav b {
  font-size: 20px;
  font-weight: normal;
}
.bottom-nav button.active {
  color: var(--blue);
  font-weight: bold;
}
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  z-index: 50;
  display: none;
  max-width: 90%;
  text-align: center;
}
.toast.show { display: block; }
@media (max-width: 850px) {
  .nav { flex-wrap: wrap; }
  .searchbox { order: 3; flex-basis: 100%; max-width: none; }
  .products { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero-circle { width: 155px; height: 155px; font-size: 75px; }
}
@media (max-width: 600px) {
  body { padding-bottom: 75px; }
  .topbar .wrap { justify-content: center; text-align: center; }
  .nav > div:last-child .light { display: none; }
  .brand { font-size: 18px; }
  .hero-panel { grid-template-columns: 1fr; }
  .hero-circle { width: 110px; height: 110px; font-size: 60px; }
  .hero-art { display: none; }
  .trust { grid-template-columns: 1fr; gap: 8px; }
  .trust-item { padding: 12px; }
  .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .product-image { height: 125px; }
  .card { padding: 8px; }
  .card h3 { font-size: 13px; }
  .price { font-size: 15px; }
  .card-actions { grid-template-columns: 1fr; }
  .card-actions button { padding: 9px; }
  .promo { flex-direction: column; align-items: flex-start; }
  .footer-grid { grid-template-columns: 1fr; }
  .form-grid, .detail-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .bottom-nav { display: flex; }
  .modal { padding: 15px; }
  .detail-image { min-height: 200px; }
}
</style>
</head>
